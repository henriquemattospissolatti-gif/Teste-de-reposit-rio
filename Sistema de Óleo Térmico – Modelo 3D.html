<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema de Óleo Térmico – Modelo 3D</title>
<style>
:root{--bg:#0f1115;--fg:#e8eaed;--card:rgba(25,28,34,.88);--bd:#333a45;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#e8eaed}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas{display:block}
#ui{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top,0px));background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.55;max-width:250px}
#ui b{font-size:13px}
.s{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
#info{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-size:12px;max-width:560px}
</style></head><body>
<div id="ui"><b>Sistema de óleo térmico a 280 °C</b><br>
<span class="s" style="background:#ff5a36"></span>Óleo quente (ida)<br>
<span class="s" style="background:#3c8dff"></span>Óleo resfriado (retorno)<br>
Arraste para girar · role para zoom · clique num equipamento</div>
<div id="info">Clique em um equipamento para ver os dados do relatório.</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const W=innerWidth,H=innerHeight;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0f1115);
const cam=new THREE.PerspectiveCamera(45,W/H,.1,300);cam.position.set(4,22,34);
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(W,H);r.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(r.domElement);
const ctl=new THREE.OrbitControls(cam,r.domElement);ctl.target.set(2,1.5,1);ctl.update();
scene.add(new THREE.HemisphereLight(0xffffff,0x334455,.9));
const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(10,25,15);scene.add(dl);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,40),new THREE.MeshStandardMaterial({color:0x1b1f27}));floor.rotation.x=-Math.PI/2;scene.add(floor);
scene.add(new THREE.GridHelper(60,60,0x2a303b,0x20252e));
const pick=[];
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,metalness:.4,roughness:.5},o));
function add(g,m,x,y,z,info){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);scene.add(o);if(info){o.userData.info=info;pick.push(o)}return o}
function label(t,x,y,z){const c=document.createElement('canvas');c.width=512;c.height=96;const g=c.getContext('2d');g.fillStyle='rgba(20,24,30,.85)';g.fillRect(0,0,512,96);g.fillStyle='#fff';g.font='bold 38px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(t,256,48);
const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c)}));s.position.set(x,y,z);s.scale.set(4.4,.83,1);scene.add(s)}
// Tanque
add(new THREE.CylinderGeometry(2,2,4,32),M(0x555d6b),-11,2,-4,'<b>Tanque de óleo térmico</b> – óleo sintético a 280 °C, ρ = 780 kg/m³, ν = 0,8·10⁻⁶ m²/s, pv = 12 kPa. Afoga a bomba (desnível de sucção 2,5 m).');
add(new THREE.CylinderGeometry(1.95,1.95,.1,32),M(0xe0742a,{emissive:0x401500}),-11,3.4,-4);
label('Tanque 280 °C',-11,5.2,-4);
function pump(x,z,color,name,info){
 add(new THREE.CylinderGeometry(1,1,.5,32),M(color),x,.6,z,info).rotation.z=Math.PI/2;
 const mt=add(new THREE.CylinderGeometry(.75,.75,2,24),M(0x3a4a5c),x+1.5,.75,z,info);mt.rotation.z=Math.PI/2;
 add(new THREE.BoxGeometry(4,.2,1.8),M(0x2b313b),x+.6,.1,z);label(name,x+.5,2.6,z)}
pump(-7,-4,0x2fa05a,'Bomba 01 (primária)','<b>Bomba 01</b> – Schneider FIT 100-065-125, rotor 143 mm, motor 20 cv, 2 polos. Ponto de projeto: 120 m³/h e 23,5 m. Vazão constante. NPSHd = 13,49 m (NPSHr = 3,2 m).');
// Aquecedor
add(new THREE.BoxGeometry(3.4,4,3),M(0xd84a1b),-1.5,2,-4,'<b>Aquecedor a gás Pirobloc GFT-170</b> – 1,7 MW, serpentinas helicoidais multitubulares, 3 passes de gases. Vazão rígida de 120 m³/h para evitar craqueamento do óleo.');
add(new THREE.CylinderGeometry(.35,.35,2.2,16),M(0x888888),-1.5,5.1,-4);
add(new THREE.BoxGeometry(1,1.2,.5),M(0xcfd2d6),-1.5,2.6,-2.3);
label('Aquecedor GFT-170',-1.5,6.7,-4);
// Desacoplamento
add(new THREE.CylinderGeometry(.9,.9,4.6,32),M(0x6a4fd6),6,2.3,-4,'<b>Desacoplamento hidráulico (ponte hidráulica)</b> – isola a vazão fixa do primário (120 m³/h) da vazão variável do secundário (140 m³/h).');
label('Desacoplamento',6,5.7,-4);
// Reatores
for(let i=0;i<4;i++){const x=1+i*3.5;
 add(new THREE.CylinderGeometry(1.2,1.2,2.6,32),M(0x1d4fb8,{transparent:true,opacity:.85}),x,1.5,5,'<b>Reator '+(i+1)+'</b> – Pfaudler/De Dietrich DIN-CE (DIN 28136), vitrificado glass-lined WWG 9100, camisa de meio-tubo (half-pipe).');
 add(new THREE.SphereGeometry(1.2,24,12,0,Math.PI*2,0,Math.PI/2),M(0x1d4fb8,{transparent:true,opacity:.85}),x,2.8,5);
 add(new THREE.CylinderGeometry(.08,.08,1.6,8),M(0xaaaaaa),x,4,5);
 add(new THREE.BoxGeometry(.6,.5,.6),M(0x2fb0ff),x,4.9,5);
 label('Reator '+(i+1),x,5.8,5)}
pump(14,5,0x2fa05a,'Bomba 02 (secundária)','<b>Bomba 02</b> – Schneider FIT 100-065-160, rotor 171 mm, motor 30 cv com inversor. Ponto de projeto: 140 m³/h e 36,7 m. Vazão variável. NPSHd = 13,89 m (NPSHr = 3,8 m).');
add(new THREE.BoxGeometry(1.2,2,.8),M(0x8a8f98),17.5,1,5.5,'<b>Inversor de frequência (VFD)</b> – modula a rotação da Bomba 02 (leis de semelhança), reduzindo o consumo conforme a demanda dos reatores.');
label('Inversor (VFD)',17.5,3.2,5.5);
// Tubulações
const HOT=0xff5a36,COLD=0x3c8dff,paths=[];
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function pipe(pts,col,flow){pts=pts.map(p=>V(...p));const m=M(col,{emissive:col,emissiveIntensity:.25});let len=[0],tot=0;
 for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],d=b.clone().sub(a),l=d.length();tot+=l;len.push(tot);
  const c=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,l,10),m);c.position.copy(a.clone().add(b).multiplyScalar(.5));c.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());scene.add(c);
  const j=new THREE.Mesh(new THREE.SphereGeometry(.13,10,10),m);j.position.copy(b);scene.add(j)}
 if(flow)paths.push({pts,len,tot,col,n:Math.ceil(tot/3),spd:flow})}
// Primário
pipe([[-9,1.6,-4],[-8,1.6,-4],[-8,.6,-4]],HOT,0);
pipe([[-11,.4,-4],[-9,.4,-4],[-8,.6,-4]],HOT,0);
pipe([[-11,.4,-4],[-8.05,.6,-4]],HOT,0);
pipe([[-11,.4,-4],[-8,.6,-4],[-6,.6,-4],[-6,1.6,-4],[-3.2,1.6,-4]],HOT,4);
pipe([[-1.5,4.0,-4],[-1.5,1.6,-4]],HOT,0);
pipe([[0.2,1.6,-4],[5.1,1.6,-4]],HOT,4);
pipe([[6,.4,-4],[6,.4,-6.5],[-11,.4,-6.5],[-11,.4,-6]],COLD,4);
// Secundário (ida)
pipe([[6,3.6,-4],[6,3.6,1.5],[1,3.6,1.5]],HOT,3);
pipe([[6,3.6,1.5],[11.5,3.6,1.5]],HOT,3);
for(let i=0;i<4;i++){const x=1+i*3.5;pipe([[x,3.6,1.5],[x,3.6,5],[x,4.7,5]],HOT,3)}
// Secundário (retorno)
for(let i=0;i<4;i++){const x=1+i*3.5;pipe([[x,.4,6.2],[x,.4,8]],COLD,3)}
pipe([[1,.4,8],[14,.4,8],[14,.4,6.2]],COLD,3);
pipe([[14,.6,3.8],[14,2.2,3.8],[14,2.2,-4],[6.9,2.2,-4]],COLD,3);
pipe([[15,.7,5],[17,.7,5.4]],0xffd24a,0);
// Partículas
const dots=[];const gm=new THREE.SphereGeometry(.2,10,10);
paths.forEach(p=>{if(!p.spd)return;for(let i=0;i<p.n;i++){const m=new THREE.Mesh(gm,new THREE.MeshBasicMaterial({color:p.col===HOT?0xffd0a0:0xb0d8ff}));scene.add(m);dots.push({m,p,t:i*3})}});
function at(p,s){let i=1;while(i<p.len.length-1&&p.len[i]<s)i++;const a=p.pts[i-1],b=p.pts[i],k=(s-p.len[i-1])/(p.len[i]-p.len[i-1]);return a.clone().lerp(b,Math.min(Math.max(k,0),1))}
const clock=new THREE.Clock();
function loop(){const dt=clock.getDelta();dots.forEach(d=>{d.t=(d.t+dt*d.p.spd)%d.p.tot;d.m.position.copy(at(d.p,d.t))});ctl.update();r.render(scene,cam);requestAnimationFrame(loop)}
loop();
// Seleção
const ray=new THREE.Raycaster(),mp=new THREE.Vector2();
r.domElement.addEventListener('click',e=>{mp.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mp,cam);const h=ray.intersectObjects(pick)[0];if(h)document.getElementById('info').innerHTML=h.object.userData.info});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
</script></body></html>
